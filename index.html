<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Tangkap Kotak</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      text-align: center;
    }

    #hud {
      display: flex;
      gap: 20px;
      font-size: 18px;
      margin-bottom: 15px;
    }

    #startBtn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    #startBtn:disabled {
      background: #64748b;
    }

    #message {
      margin-bottom: 15px;
      text-align: center;
      color: #cbd5e1;
    }

    #gameArea {
      width: 90vw;
      max-width: 400px;
      height: 60vh;
      max-height: 500px;
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    #target {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      position: absolute;
      display: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <h1>🎯 Game Tangkap Kotak</h1>

  <div id="hud">
    <div>Skor: <span id="score">0</span></div>
    <div>Waktu: <span id="time">30</span></div>
  </div>

  <button id="startBtn">Mulai Game</button>
  <div id="message">Tekan tombol mulai, lalu tangkap kotaknya secepat mungkin!</div>

  <div id="gameArea">
    <div id="target"></div>
  </div>

  <script>
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const startBtn = document.getElementById("startBtn");
    const messageEl = document.getElementById("message");
    const gameArea = document.getElementById("gameArea");
    const target = document.getElementById("target");

    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let gameRunning = false;

    function randomPosition() {
      const maxX = gameArea.clientWidth - target.offsetWidth;
      const maxY = gameArea.clientHeight - target.offsetHeight;

      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      gameRunning = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      messageEl.textContent = "Cepat! Klik kotaknya sebanyak mungkin!";
      startBtn.disabled = true;
      target.style.display = "block";

      randomPosition();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      gameRunning = false;
      target.style.display = "none";
      startBtn.disabled = false;
      messageEl.textContent = "Waktu habis! Skor akhir kamu: " + score;
    }

    target.addEventListener("pointerdown", function () {
      if (!gameRunning) return;
      score++;
      scoreEl.textContent = score;
      randomPosition();
    });

    startBtn.addEventListener("click", startGame);
  </script>
</body>
  </html>
